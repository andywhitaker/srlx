set / system lldp admin-state enable
set / system lldp management-address mgmt0.0 type [ IPv4 ]
set / system lldp interface mgmt0 admin-state disable

set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 5.5.5.5/32
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.4.5.5/24

set / network-instance default interface system0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default protocols ospf instance ospf-peering admin-state enable
set / network-instance default protocols ospf instance ospf-peering version ospf-v2
set / network-instance default protocols ospf instance ospf-peering router-id 5.5.5.5
set / network-instance default protocols ospf instance ospf-peering area 0.0.0.0 interface system0.0 passive true
set / network-instance default protocols ospf instance ospf-peering area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point